name: Atualizar notícias

on:
  schedule:
    - cron: "17 9,12,15,18,21,0 * * *"   # 06:17 às 21:17 de Brasília, a cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - name: Salvar news.json
        run: |
          if git diff --quiet -- news.json; then echo "Sem mudanças"; exit 0; fi
          git config user.name "vega-bot"
          git config user.email "vega-bot@users.noreply.github.com"
          git add news.json
          git commit -m "Atualiza notícias"
          git push
